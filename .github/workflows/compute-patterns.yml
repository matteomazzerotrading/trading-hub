name: Compute Patterns

# Pattern Scanner e segnali della TBO Strategy su tutti i titoli: ogni sera dei giorni di borsa, a mercati chiusi,
# dopo il calcolo dei fair value. Le regole della TBO non sono nel repository: arrivano dal segreto TBO_RULES
# (il modulo JavaScript in base64); se il segreto manca, i segnali TBO non vengono aggiornati.
on:
  schedule:
    - cron: '50 22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/compute_patterns.mjs'
      - 'scripts/compute_tbo.mjs'
      - 'scripts/compute_diario.mjs'
      - 'scripts/compute_risk.mjs'
      - 'scripts/notify_telegram.mjs'
      - 'scripts/avvisi_telegram.mjs'
      - 'scripts/fetch_daily.py'
      - 'scripts/compute_patterns_ext.py'
      - '.github/workflows/compute-patterns.yml'
  workflow_dispatch:
    inputs:
      solo_registra:
        description: 'Segna i nuovi segnali come già pubblicati senza inviarli su Telegram'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: patterns
  cancel-in-progress: true

jobs:
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scarica le barre giornaliere
        run: |
          pip install yfinance --quiet
          python scripts/fetch_daily.py
      - name: Scarica le barre dei titoli aggiunti ai segnali TBO
        continue-on-error: true
        run: python scripts/fetch_ext_daily.py
      - name: Calcola i pattern
        run: node scripts/compute_patterns.mjs
      - name: Segnali della TBO Strategy
        continue-on-error: true
        env:
          TBO_RULES: ${{ secrets.TBO_RULES }}
        run: |
          if [ -z "$TBO_RULES" ]; then echo "Segreto TBO_RULES non impostato: i segnali TBO non vengono aggiornati."; exit 0; fi
          mkdir -p scripts/private
          printf '%s' "$TBO_RULES" | tr -d ' \r\n' | base64 -d > scripts/private/tbo_rules.mjs 2>/dev/null
          node scripts/compute_tbo.mjs
          node scripts/compute_diario.mjs || echo "Diario delle operazioni non aggiornato"
          rm -rf scripts/private
      - name: Correlazione tra i titoli del portafoglio
        continue-on-error: true
        run: node scripts/compute_risk.mjs
      - name: Notifiche Telegram dei nuovi segnali TBO
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SOLO_REGISTRA: ${{ inputs.solo_registra && '1' || '' }}
        run: node scripts/notify_telegram.mjs
      - name: Avvisi personali del bot Telegram sui titoli seguiti
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/avvisi_telegram.mjs
      - name: Pattern Scanner sugli altri titoli (USA ed Europa)
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/compute_patterns_ext.py
      - name: Allinea al ramo principale
        # Il calcolo settimanale (tbo-stats) può aver riscritto tbo_state_ext.json nel frattempo: per i titoli presenti
        # in entrambi vale lo stato più avanzato, i titoli nuovi del settimanale si aggiungono, quelli tolti si tolgono
        run: |
          cp tbo_state_ext.json /tmp/ext_sera.json 2>/dev/null || true
          git checkout -- tbo_state_ext.json 2>/dev/null || true
          git pull --rebase --autostash
          if [ -f /tmp/ext_sera.json ]; then node -e "
            const fs = require('fs'), s = JSON.parse(fs.readFileSync('/tmp/ext_sera.json', 'utf8')), r = JSON.parse(fs.readFileSync('tbo_state_ext.json', 'utf8'));
            for (const [k, x] of Object.entries(r.titoli)) { const y = s.titoli[k]; if (y && !y.attesa && (y.fino || '') >= (x.fino || '')) r.titoli[k] = { ...y, n: x.n, tv: x.tv }; }
            r.aggiornato = s.aggiornato || r.aggiornato;
            fs.writeFileSync('tbo_state_ext.json', JSON.stringify(r) + '\\n');"; fi
      - name: Salva i risultati
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: pattern scanner e segnali TBO [skip ci]"
          file_pattern: "avvisi_stato.json diario.json patterns.json patterns_detail.json patterns_ext.json patterns_ext tbo_signals.json tbo_state.json tbo_state_ext.json tbo_notified.json portfolio_risk.json"
          commit_user_name: "TradingHub Bot"
          commit_user_email: "bot@tradinghub.local"
