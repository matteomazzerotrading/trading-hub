name: Dump Inputs

# Scarica i dati storici (bilanci, prezzi, tassi) per la verifica sul passato della formula del fair value.
# Si avvia solo a mano; i dati finiscono nel ramo separato 'backtest-data', non nel ramo principale del sito.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bilanci
        run: node scripts/dump_inputs.mjs
      - name: Prezzi, decennale e CPI
        run: |
          pip install yfinance --quiet
          python scripts/dump_market.py
      - name: Salva i dati nel ramo backtest-data
        run: |
          gzip -9 backtest_inputs/*.json
          git config user.name "TradingHub Bot"
          git config user.email "bot@tradinghub.local"
          git checkout --orphan backtest-data
          git rm -rf --cached . > /dev/null
          git add -f backtest_inputs
          git commit -qm "Dati per la verifica sul passato [skip ci]"
          git push -f origin backtest-data
