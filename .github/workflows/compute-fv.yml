name: Compute Fair Value

# Fair value di tutti i titoli con la formula dell'indicatore "FAIR VALUE (dati realizzati)".
# Ogni sera dei giorni di borsa dopo la chiusura USA, e ogni volta che cambia la formula.
on:
  schedule:
    - cron: '20 22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/fv_engine.js'
      - 'scripts/compute_fv.mjs'
      - 'scripts/fetch_market_data.py'
      - '.github/workflows/compute-fv.yml'
  workflow_dispatch:

permissions:
  contents: write

# Evita che due workflow scrivano data.json nello stesso momento;
# un nuovo calcolo dei fair value sostituisce quello eventualmente ancora in corso
concurrency:
  group: data-json
  cancel-in-progress: true

jobs:
  compute-fv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scarica prezzi settimanali e CPI
        run: |
          pip install yfinance --quiet
          python scripts/fetch_market_data.py

      - name: Calcola i fair value
        run: node scripts/compute_fv.mjs

      - name: Salva data.json e fv_report.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: fair value dall'indicatore [skip ci]"
          file_pattern: "data.json fv_report.json"
          commit_user_name: "TradingHub Bot"
          commit_user_email: "bot@tradinghub.local"
